apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mi-api-ingress
spec:
  rules:
    - host: pepe.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mi-api-nodeport-service
                port:
                  number: 80