apiVersion: apps/v1
kind: Deployment
metadata:
  name: mi-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mi-api
  template:
    metadata:
      labels:
        app: mi-api
    spec:
      containers:
        - name: mi-api
          image: mi-api-k8s:v1
          ports:
            - containerPort: 3000
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              value: postgresql-clusterip-service
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRES_DB
---
apiVersion: v1
kind: Service
metadata:
  name: mi-api-nodeport-service
spec:
  type: NodePort
  selector:
    app: mi-api
  ports:
    - port: 3000
      targetPort: 3000