services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_DATABASE: "app"
    secrets:
      - db_root_password
    volumes:
      - db_data:/var/lib/mysql
  php:
    build: ./php
    ports:
      - "8085:80"
    environment:
      DB_HOST: db
      DB_NAME: app
      DB_USER: root
      DB_PASSWORD_FILE: /run/secrets/db_pass
    secrets:
      - db_pass
    depends_on:
      - db

volumes:
  db_data:

secrets:
  db_root_password:
    file: ./secrets/db_root_password.txt
  db_pass:
    file: ./secrets/db_password.txt