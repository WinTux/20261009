apiVersion: apps/v1
kind: Deployment
metadata:
  name: mi-api-deploy
  labels:
    app: mi-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mi-api
  template:
    metadata:
      labels:
        app: mi-api
    spec:
      containers:
        - name: mi-api-container
          image: mi-api:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: mi-api-service
spec:
  type: NodePort
  selector:
    app: mi-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30001